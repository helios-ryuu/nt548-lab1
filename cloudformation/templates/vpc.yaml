AWSTemplateFormatVersion: "2010-09-09"
Description: "NT548 Lab 01 - Nested Stack: VPC, Subnets, IGW, NAT Gateway + EIP & Route Tables"

Parameters:
  ProjectName:
    Type: String
    Default: nt548-lab1
    Description: Prefix ten cho toan bo tai nguyen mang

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: Dai CIDR cho VPC

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: Dai CIDR cho Public Subnet

  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: Dai CIDR cho Private Subnet

  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
    Description: Availability Zone dat Public va Private Subnets

Resources:
  # 1. VPC chinh (10.0.0.0/16), bat DNS Support & DNS Hostnames
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cfn-vpc"
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Course
          Value: NT548

  # 2. Internet Gateway & gan vao VPC
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cfn-igw"
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Course
          Value: NT548

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # 3. Public Subnet (10.0.1.0/24) - tu dong cap Public IP
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cfn-public-subnet"
        - Key: Tier
          Value: Public
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Course
          Value: NT548

  # 4. Private Subnet (10.0.2.0/24) - KHONG cap Public IP
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cfn-private-subnet"
        - Key: Tier
          Value: Private
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Course
          Value: NT548

  # 5. Elastic IP (EIP) & NAT Gateway dat trong Public Subnet
  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cfn-nat-eip"
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Course
          Value: NT548

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: VPCGatewayAttachment
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cfn-nat-gw"
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Course
          Value: NT548

  # 6. Public Route Table -> IGW
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cfn-public-rt"
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Course
          Value: NT548

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # 7. Private Route Table -> NAT Gateway
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cfn-private-rt"
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Course
          Value: NT548

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

Outputs:
  VpcId:
    Description: ID cua VPC
    Value: !Ref VPC

  DefaultSecurityGroupId:
    Description: ID cua Default Security Group mac dinh cua VPC
    Value: !GetAtt VPC.DefaultSecurityGroup

  PublicSubnetId:
    Description: ID cua Public Subnet
    Value: !Ref PublicSubnet

  PrivateSubnetId:
    Description: ID cua Private Subnet
    Value: !Ref PrivateSubnet

  InternetGatewayId:
    Description: ID cua Internet Gateway
    Value: !Ref InternetGateway

  NatGatewayId:
    Description: ID cua NAT Gateway
    Value: !Ref NatGateway

  NatEip:
    Description: Elastic IP gan cho NAT Gateway
    Value: !Ref NatEip
